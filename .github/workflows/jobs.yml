name: jobs
on:
  schedule:
    - cron: "7,22,37,52 6-21 * * 1-5"
  workflow_dispatch: {}
concurrency:
  group: jobs
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      actions: write
    steps:
      - run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/jobs.yml/enable
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          repository: Vova2214/cron-jobs-core
          ssh-key: ${{ secrets.SRC_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q matplotlib websocket-client
      - uses: actions/cache/restore@v4
        with:
          path: state
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python scanner.py --selftest >/dev/null 2>&1
      - run: python scanner.py 2>/dev/null | tail -1
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state
          key: state-${{ github.run_id }}
